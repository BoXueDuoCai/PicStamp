name: Build Windows EXE

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
      
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10.11'
        
    - name: Extract version from code
      id: get_version
      shell: pwsh
      run: |
        $content = Get-Content -Path 'PicStamp.py' -Raw
        if ($content -match 'APP_VERSION\s*=\s*["'']([^"'']+)["'']') {
            $version = $matches[1]
            Write-Host "Found version: $version"
        } else {
            $version = "v0.0.0"
            Write-Host "未找到 APP_VERSION，使用默认版本"
        }
        "version=$version" >> $env:GITHUB_OUTPUT
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller pillow pyqt6
        
    - name: Build EXE
      run: pyinstaller --onefile --windowed --name "PicStamp" PicStamp.py
          
    - name: Rename EXE with version
      run: |
        cd dist
        ren PicStamp.exe "PicStamp-${{ steps.get_version.outputs.version }}.exe"
          
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: PicStamp-${{ steps.get_version.outputs.version }}
        path: dist/PicStamp-${{ steps.get_version.outputs.version }}.exe
        
    - name: Create Release
      uses: ncipollo/release-action@v1
      with:
        artifacts: dist/PicStamp-${{ steps.get_version.outputs.version }}.exe
        tag: ${{ steps.get_version.outputs.version }}
        name: Release ${{ steps.get_version.outputs.version }}
        body: "自动构建版本 ${{ steps.get_version.outputs.version }}"
        draft: false
        prerelease: false
        allowUpdates: true
        token: ${{ secrets.GITHUB_TOKEN }}
